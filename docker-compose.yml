services:
  db:
    image: postgres:16
    container_name: stagehand-db
    environment:
      POSTGRES_DB: stagehand
      POSTGRES_USER: stagehand
      POSTGRES_PASSWORD: stagehand
    ports:
      - "5433:5432"
    volumes:
      - stagehand_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagehand -d stagehand"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    container_name: stagehand-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgres://stagehand:stagehand@db:5432/stagehand
      DEBUG: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    restart: unless-stopped

  collector:
    build: .
    container_name: stagehand-collector
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgres://stagehand:stagehand@db:5432/stagehand
      DEBUG: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py collect_metrics
    restart: unless-stopped

volumes:
  stagehand_pgdata:
