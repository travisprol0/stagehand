{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full" x-data="dashboardChrome()" x-init="init()" :class="{ 'dark': dark }">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Talos Monitor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{% static 'monitor/css/custom.css' %}" />
    <script src="{% static 'monitor/js/dashboard.js' %}"></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body
    class="min-h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100"
    @open-log-modal.window="openLogModal()"
    @keydown.escape.window="closeLogModal()"
  >
    {% block body %}{% endblock %}
  </body>
</html>
