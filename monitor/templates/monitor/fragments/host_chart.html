<div
  id="host-chart"
  hx-get="/fragments/charts/host/"
  hx-trigger="every {{ poll_seconds }}s"
  hx-swap="outerHTML"
>
  {% if chart %}
    <div>
      <div class="mb-2 flex items-center justify-between text-sm">
        <span class="font-medium text-slate-700 dark:text-zinc-200">CPU and memory</span>
        <span class="text-xs text-slate-500 dark:text-zinc-400">Last hour</span>
      </div>
      <svg
        viewBox="0 0 400 100"
        class="h-40 w-full"
        role="img"
        aria-label="Host CPU and memory usage over the last hour"
      >
        <defs>
          <linearGradient id="cpu-fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02" />
          </linearGradient>
          <linearGradient id="memory-fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#059669" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#059669" stop-opacity="0.02" />
          </linearGradient>
        </defs>
        <line x1="28" y1="8" x2="392" y2="8" class="stroke-slate-200 dark:stroke-zinc-700" stroke-width="1" />
        <line x1="28" y1="50" x2="392" y2="50" class="stroke-slate-200 dark:stroke-zinc-700" stroke-dasharray="3 4" stroke-width="1" />
        <line x1="28" y1="92" x2="392" y2="92" class="stroke-slate-200 dark:stroke-zinc-700" stroke-width="1" />
        <text x="4" y="12" class="fill-slate-400 dark:fill-zinc-500" font-size="8">100</text>
        <text x="8" y="54" class="fill-slate-400 dark:fill-zinc-500" font-size="8">50</text>
        <text x="12" y="94" class="fill-slate-400 dark:fill-zinc-500" font-size="8">0</text>
        {% if chart.cpu_area %}
          <polygon points="{{ chart.cpu_area }}" fill="url(#cpu-fill)" />
        {% endif %}
        {% if chart.memory_area %}
          <polygon points="{{ chart.memory_area }}" fill="url(#memory-fill)" />
        {% endif %}
        <polyline
          points="{{ chart.cpu_polyline }}"
          fill="none"
          class="stroke-sky-600 dark:stroke-sky-400"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
        <polyline
          points="{{ chart.memory_polyline }}"
          fill="none"
          class="stroke-emerald-600 dark:stroke-emerald-400"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
      </svg>
      <div class="mt-2 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400">
        <span>{{ chart.start_label }}</span>
        <span class="inline-flex items-center gap-3">
          <span class="inline-flex items-center gap-1">
            <span class="h-2 w-2 rounded-full bg-sky-600 dark:bg-sky-400"></span>
            CPU
          </span>
          <span class="inline-flex items-center gap-1">
            <span class="h-2 w-2 rounded-full bg-emerald-600 dark:bg-emerald-400"></span>
            Memory
          </span>
        </span>
        <span>{{ chart.end_label }}</span>
      </div>
    </div>
  {% else %}
    {% include "monitor/fragments/empty_state.html" with message="No history yet — wait for collector." %}
  {% endif %}
</div>
