<div
  class="h-2 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700"
  role="progressbar"
  aria-valuemin="0"
  aria-valuemax="100"
  aria-valuenow="{{ value|default:0|floatformat:0 }}"
>
  <div
    class="h-2 rounded-full bg-blue-600 dark:bg-blue-500"
    style="width: {{ value|default:0 }}%"
  ></div>
</div>
{% if label %}
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ label }}</p>
{% endif %}
